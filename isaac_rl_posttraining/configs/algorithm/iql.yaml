# Implicit Q-Learning over a trainable base model (GR00T N1.7, pi0).
#
# Pure offline: no live collection. The base model's VLM backbone stays frozen.
#   python scripts/train.py algorithm=iql base_model=gr00t_n17 base_model.ckpt=<ckpt> \
#       base_model.dataset_dir=<lerobot dataset>
# Evaluation calls infer(obs) on the trained policy.

defaults:
  - base_iql
  - _self_

name: iql
expectile: 0.7
advantage_temp: 10.0     # 1.0 weights sparse-reward samples ~equally (IQL ~ BC); 10 was best on G1 DrillLift
clip_score: 20.0
gamma: 0.99
tau: 0.005
batch_size: 256
num_q: 5
n_q_to_sample: 2
q_reduce: min
num_updates_per_train_step: 1
bootstrap_horizon: 1
critic_hidden: 1024
critic_n_heads: 8
actor_optimizer_lr: 1.0e-4
critic_optimizer_lr: 3.0e-4
actor_optimizer_weight_decay: 1.0e-5
# GR00T's own fine-tuning recipe: 5% linear warmup, cosine decay, clip at 1.0.
actor_lr_schedule: cosine
actor_lr_warmup_ratio: 0.05
actor_max_grad_norm: 1.0
critic_optimizer_weight_decay: 0.0
learning_starts: 0
