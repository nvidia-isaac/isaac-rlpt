# The documentation site: a strict build on every pull request, and on the default branch a
# GitHub Pages deployment of that build together with the static project pages. Pages needs Settings > Pages > Source: GitHub Actions,
# with the site's visibility set there.
name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  # Repository links in the site point at this repository and branch.
  DOCS_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
  DOCS_REPO_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.11.19"
      - name: Install the docs toolchain
        # The docs extra is the Sphinx toolchain; --extra cpu keeps torch off the GPU index.
        # Wheels only: conf.py reads the checkout, so the project itself is not installed,
        # and omegaconf's antlr4 runtime (sdist only) is never imported by the build.
        run: >-
          uv sync --locked --no-build --no-install-project
          --no-install-package antlr4-python3-runtime --extra cpu --extra docs
      - name: Build the site strictly
        # Every warning is an error, so a dead cross-reference fails the pull request.
        run: .venv/bin/sphinx-build -b html docs public -W --keep-going
      - name: Add the project pages
        # A docs/<name>/ folder with its own index.html is a self-contained static site served at
        # /<name>/ beside the documentation; conf.py keeps the Sphinx build out of it (see docs/README.md).
        run: |
          for index in docs/*/index.html; do
            [ -e "$index" ] || continue
            cp -r "$(dirname "$index")" public/
          done
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
