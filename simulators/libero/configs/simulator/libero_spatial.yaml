# LIBERO-Spatial suite: ten pick-and-place tasks in one scene, identical
# objects distinguished only by spatial relations. Install:
# simulators/libero/README.md; protocol and reference numbers:
# simulators/libero/README.md.
#
# The "libero" provider steps MuJoCo/robosuite in-process (no env server).

provider: libero
suite: libero_spatial

# Suite-wide episode cap: LIBERO's own evaluation harness caps every suite
# at 600 steps (libero/configs/eval/default.yaml). LIBERO episodes end only
# on success, so the cap ends failures as truncations.
max_episode_steps: 600

# Camera resolution: 256 matches the public LeRobot conversions of the
# LIBERO demonstrations; use 128 to match the original HDF5 datasets.
image_size: 256
camera_name: agentview

# GR00T-N1.7-LIBERO reference-evaluation and flow geometry.
gr00t_eval:
  max_episode_steps: 720
  image_size: 256
  action_horizon: 16
  n_action_steps: 8

# Task enumeration in the suite's canonical order (task_order_index=0),
# from libero.libero.benchmark.get_benchmark("libero_spatial"). Pinned here
# so configs resolve without the LIBERO stack installed;
# simulators/libero/tests/test_libero_env.py cross-checks the list against the real
# benchmark when that stack is importable.
tasks:
  - pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate
  - pick_up_the_black_bowl_next_to_the_ramekin_and_place_it_on_the_plate
  - pick_up_the_black_bowl_from_table_center_and_place_it_on_the_plate
  - pick_up_the_black_bowl_on_the_cookie_box_and_place_it_on_the_plate
  - pick_up_the_black_bowl_in_the_top_drawer_of_the_wooden_cabinet_and_place_it_on_the_plate
  - pick_up_the_black_bowl_on_the_ramekin_and_place_it_on_the_plate
  - pick_up_the_black_bowl_next_to_the_cookie_box_and_place_it_on_the_plate
  - pick_up_the_black_bowl_on_the_stove_and_place_it_on_the_plate
  - pick_up_the_black_bowl_next_to_the_plate_and_place_it_on_the_plate
  - pick_up_the_black_bowl_on_the_wooden_cabinet_and_place_it_on_the_plate
