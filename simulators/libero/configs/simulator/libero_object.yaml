# LIBERO-Object suite: ten pick-and-place tasks with a shared scene layout
# and ten distinct objects. Install: simulators/libero/README.md; protocol
# and reference numbers: simulators/libero/README.md.
#
# The "libero" provider steps MuJoCo/robosuite in-process (no env server).

provider: libero
suite: libero_object

# Suite-wide episode cap: LIBERO's own evaluation harness caps every suite
# at 600 steps (libero/configs/eval/default.yaml). LIBERO episodes end only
# on success, so the cap ends failures as truncations.
max_episode_steps: 600

# Camera resolution: 256 matches the public LeRobot conversions of the
# LIBERO demonstrations; use 128 to match the original HDF5 datasets.
image_size: 256
camera_name: agentview

# GR00T-N1.7-LIBERO reference-evaluation and flow geometry.
gr00t_eval:
  max_episode_steps: 720
  image_size: 256
  action_horizon: 16
  n_action_steps: 8

# Task enumeration in the suite's canonical order (task_order_index=0),
# from libero.libero.benchmark.get_benchmark("libero_object"). Pinned here
# so configs resolve without the LIBERO stack installed;
# simulators/libero/tests/test_libero_env.py cross-checks the list against the real
# benchmark when that stack is importable.
tasks:
  - pick_up_the_alphabet_soup_and_place_it_in_the_basket
  - pick_up_the_cream_cheese_and_place_it_in_the_basket
  - pick_up_the_salad_dressing_and_place_it_in_the_basket
  - pick_up_the_bbq_sauce_and_place_it_in_the_basket
  - pick_up_the_ketchup_and_place_it_in_the_basket
  - pick_up_the_tomato_sauce_and_place_it_in_the_basket
  - pick_up_the_butter_and_place_it_in_the_basket
  - pick_up_the_milk_and_place_it_in_the_basket
  - pick_up_the_chocolate_pudding_and_place_it_in_the_basket
  - pick_up_the_orange_juice_and_place_it_in_the_basket
