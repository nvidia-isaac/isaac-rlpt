# LIBERO-Goal suite: ten tasks in one scene with shared objects but
# distinct goals. Install: simulators/libero/README.md; protocol and
# reference numbers: simulators/libero/README.md.
#
# The "libero" provider steps MuJoCo/robosuite in-process (no env server).

provider: libero
suite: libero_goal

# Suite-wide episode cap: LIBERO's own evaluation harness caps every suite
# at 600 steps (libero/configs/eval/default.yaml). LIBERO episodes end only
# on success, so the cap ends failures as truncations.
max_episode_steps: 600

# Camera resolution: 256 matches the public LeRobot conversions of the
# LIBERO demonstrations; use 128 to match the original HDF5 datasets.
image_size: 256
camera_name: agentview

# GR00T-N1.7-LIBERO reference-evaluation and flow geometry.
gr00t_eval:
  max_episode_steps: 720
  image_size: 256
  action_horizon: 16
  n_action_steps: 8

# Task enumeration in the suite's canonical order (task_order_index=0),
# from libero.libero.benchmark.get_benchmark("libero_goal"). Pinned here so
# configs resolve without the LIBERO stack installed;
# simulators/libero/tests/test_libero_env.py cross-checks the list against the real
# benchmark when that stack is importable.
tasks:
  - open_the_middle_drawer_of_the_cabinet
  - put_the_bowl_on_the_stove
  - put_the_wine_bottle_on_top_of_the_cabinet
  - open_the_top_drawer_and_put_the_bowl_inside
  - put_the_bowl_on_top_of_the_cabinet
  - push_the_plate_to_the_front_of_the_stove
  - put_the_cream_cheese_in_the_bowl
  - turn_on_the_stove
  - put_the_bowl_on_the_plate
  - put_the_wine_bottle_on_the_rack
